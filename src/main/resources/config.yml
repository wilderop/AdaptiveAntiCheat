# AdaptiveAntiCheat 1.1 — log-only, per-context, tick-based
# No punishments. Sessions are the unit of analysis (not per-move spam).

config-version: 2

trust:
  auto-trust-hours: 500
  recheck-interval-minutes: 30

adaptive:
  # Counted once per trusted over-threshold SESSION, not per tick
  false-positives-per-adjustment: 8
  adjustment-amount: 0.03
  max-multiplier: 1.75
  min-multiplier: 0.85

checks:
  speed:
    enabled: true
    # Ignore samples when more than this many server ticks elapsed (lag/unload)
    max-gap-ticks: 5
    # Horizontal distance in one sample treated as teleport/pearl/chunk, not speed
    teleport-distance: 10.0
    min-distance: 0.08
    session-gap-ticks: 40
    ignore-after-teleport-ticks: 10
    ignore-after-riptide-ticks: 40
    firework-ticks: 40
    wind-ticks: 30
    # Base max horizontal blocks/tick per context (before adaptive multiplier)
    contexts:
      ground: 0.42
      speed_potion: 0.55
      ice: 1.20
      soul_speed: 0.70
      vehicle_land: 1.00
      vehicle_water: 0.80
      vehicle_ice: 6.00
      elytra: 3.50
      elytra_firework: 12.00
      riptide: 8.00
      wind_burst: 2.50

  timer:
    enabled: true
    window-ticks: 40
    flag-ratio: 1.35
    min-distance: 0.08
    log-cooldown-ticks: 100

  fly:
    enabled: true
    hover-air-ticks: 40
    fly-air-ticks: 60
    hover-dy: 0.08

  # Live ore-find rate. CoreProtect is queried only after a flag.
  ore:
    enabled: true
    window-seconds: 600
    trail-size: 400
    cooldown-seconds: 180
    min-axis-length: 8
    diamond:
      materials:
        - DIAMOND_ORE
        - DEEPSLATE_DIAMOND_ORE
      waste:
        - STONE
        - DEEPSLATE
        - TUFF
        - GRANITE
        - DIORITE
        - ANDESITE
        - CALCITE
        - SMOOTH_BASALT
      min-y: -64
      max-y: 16
      min-ores: 4
      # Flag when waste-per-ore < default / (flag-factor * adaptive multiplier)
      default-waste-per-ore: 50.0
      flag-factor: 2.0
    debris:
      materials:
        - ANCIENT_DEBRIS
      waste:
        - NETHERRACK
        - BLACKSTONE
        - BASALT
        - SOUL_SOIL
        - MAGMA_BLOCK
      min-y: 8
      max-y: 22
      min-ores: 3
      default-waste-per-ore: 80.0
      flag-factor: 2.0
    coreprotect:
      enabled: true
      lookup-seconds: 1800

logging:
  # Keep this false — v1 console spam buried real incidents
  console: false
  samples: true
  sample-interval-ticks: 20

messages:
  prefix: "<gray>[<gold>AAC</gold>]</gray> "
  trusted: "<green>You have been marked as a trusted player.</green>"
  untrusted: "<yellow>You are no longer marked as trusted.</yellow>"
  no-permission: "<red>No permission.</red>"
  player-not-found: "<red>Player not found.</red>"
